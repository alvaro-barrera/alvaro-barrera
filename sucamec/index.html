n":"Según el Artículo 279-G del Código Penal Peruano constituye delito el que sin estar debidamente autorizado:","options":[{"id":"a","text":"Fabrica y comercializa armas de fuego."},{"id":"b","text":"Modifica y almacenan armas de fuego."},{"id":"c","text":"Usa y porta armas de fuego."},{"id":"d","text":"Trafica y suministra armas de fuego."},{"id":"e","text":"Todas las anteriores son correctas."}],"correct_answer":"e"},{"id":4,"type":"single_choice","question":"Según el Artículo 279-G del Código Penal Peruano constituye delito el que sin estar debidamente autorizado:","options":[{"id":"a","text":"Fabrica y comercializa cualquier tipo de municiones."},{"id":"b","text":"Fabrica y comercializa accesorios de armas de fuego."},{"id":"c","text":"Comercializa materiales destinados a la fabricación de armas de fuego o municiones."},{"id":"d","text":"A, B y C son correctas."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"d"},{"id":5,"type":"single_choice","question":"Según el Artículo 70 numeral 70.3 de la Ley 30299 podrán ser inhabilitadas por la SUCAMEC por un lapso de dos (02) años las personas que reporten en dos eventos distintos en un lapso de 2 años:","options":[{"id":"a","text":"La pérdida de arma de fuego."},{"id":"b","text":"El hurto de arma de fuego."},{"id":"c","text":"El robo de arma de fuego."},{"id":"d","text":"A, B y C son correctas."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"d"},{"id":6,"type":"single_choice","question":"Según el Artículo 70 numeral 70.1 de la Ley 30299 la pérdida, robo o hurto de cualquier arma de fuego debe ser comunicada a la SUCAMEC dentro de:","options":[{"id":"a","text":"72 horas."},{"id":"b","text":"30 días."},{"id":"c","text":"48 horas."},{"id":"d","text":"24 horas."},{"id":"e","text":"12 horas."}],"correct_answer":"c"},{"id":7,"type":"single_choice","question":"Según el Art.20 del Reglamento, no cumplir con trasladar las armas de fuego descargadas o desabastecidas bajo la modalidad de Deporte y tiro recreativo es una falta grave y se sanciona con:","options":[{"id":"a","text":"Multa."},{"id":"b","text":"Decomiso."},{"id":"c","text":"Incautación."},{"id":"d","text":"Cancelación de licencia."},{"id":"e","text":"A y B son correctas."}],"correct_answer":"e"},{"id":8,"type":"single_choice","question":"Según el Art.37 Inciso e) de la Ley 30299 portar o usar armas de fuego bajo el consumo de alcohol o bajo los efectos de sustancias estupefacientes o psicotrópicas es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Multa."},{"id":"b","text":"Decomiso."},{"id":"c","text":"Internamiento temporal."},{"id":"d","text":"Incautación."},{"id":"e","text":"A y B son correctas."}],"correct_answer":"e"},{"id":9,"type":"single_choice","question":"Según el Art.37 Inciso h) de la Ley 30299 Usar un arma distinta a la indicada en la tarjeta de propiedad o autorizada por la licencia de uso es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Depósito temporal."},{"id":"b","text":"Internamiento por 90 días."},{"id":"c","text":"Multa."},{"id":"d","text":"Decomiso."},{"id":"e","text":"C y D son correctas."}],"correct_answer":"e"},{"id":10,"type":"single_choice","question":"Según el Art.37 Inciso m) de la Ley 30299 usar silenciadores o dispositivos que alteren u oculten la apariencia o funcionamiento de las armas, excepto en armas destinadas para caza es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Depósito temporal."},{"id":"b","text":"Internamiento por 120 días."},{"id":"c","text":"Multa y decomiso."},{"id":"d","text":"Cancelación de la licencia en forma temporal."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"c"},{"id":11,"type":"single_choice","question":"Según el Art.37 Inciso f) de la Ley 30299 portar o usar armas de fuego en manifestaciones públicas, espectáculos con afluencia de público, centros de esparcimiento entre otros espacios públicos es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Internamiento del arma por 30 días."},{"id":"b","text":"Multa."},{"id":"c","text":"Decomiso."},{"id":"d","text":"Incautación."},{"id":"e","text":"B y C son correctas."}],"correct_answer":"e"},{"id":12,"type":"single_choice","question":"Según el Art.27 del Reglamento de la Ley 30299 Almacenar, exhibir, portar o poseer armas de terceros sin autorización es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Cancelación de la licencia por 90 días."},{"id":"b","text":"Internamiento del arma por 120 días."},{"id":"c","text":"Incautación y decomiso."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"d"},{"id":13,"type":"single_choice","question":"Según el Artículo 16.7 del Reglamento de la Ley 30299 Transferir, otorgar, dar o ceder armas de fuego a terceros que no tengan autorización o licencia de uso es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Cancelación de la licencia."},{"id":"b","text":"Internamiento temporal del arma."},{"id":"c","text":"Decomiso del arma."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"A y C son correctas."}],"correct_answer":"e"},{"id":14,"type":"single_choice","question":"Según el Artículo 32 de la Ley 30299 no depositar el arma de fuego por disposición o mandato de la autoridad competente en el plazo establecido (SUCAMEC, PNP, Poder Judicial o Ministerio Público) es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Cancelación de la licencia de uso de arma de fuego."},{"id":"b","text":"Internamiento por 30 días del arma de fuego."},{"id":"c","text":"Decomiso del arma."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"A y C son correctas."}],"correct_answer":"a"},{"id":15,"type":"single_choice","question":"Según el Artículo 37 de la Ley 30299 Art.18, 19, 20, 21, 22 y 23 del Reglamento, portar o usar armas de fuego en una modalidad distinta a la autorizada es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Cancelación de la licencia de uso de arma de fuego."},{"id":"b","text":"Decomiso del arma."},{"id":"c","text":"Internamiento del arma por 90 días."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"A y B son correctas."}],"correct_answer":"e"},{"id":16,"type":"single_choice","question":"Según el Artículo 37 Inciso b) de la Ley 30299 efectuar modificaciones que alteren o eliminen las características identificatorias del arma de fuego o efectuar modificaciones que alteren la cadencia de tiro, el calibre o la potencia del arma de fuego es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Multa."},{"id":"b","text":"Cancelación de la licencia de uso de arma de fuego y decomiso."},{"id":"c","text":"Internamiento del arma por 60 días."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"Todas las anteriores son correctas."}],"correct_answer":"b"},{"id":17,"type":"single_choice","question":"Según el Artículo 16 del Reglamento de la Ley 30299 portar, usar, importar, comercializar armas de fuego de cadencia automática o con calibres mayores a las permitidas es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Cancelación de la licencia de arma de fuego."},{"id":"b","text":"Multa."},{"id":"c","text":"Decomiso."},{"id":"d","text":"Internamiento del arma por 120 días."},{"id":"e","text":"A y C son correctas."}],"correct_answer":"e"},{"id":18,"type":"single_choice","question":"Según el Artículo 37 Inciso b) de la Ley 30299 portar o usar armas de fuego de uso civil con las letras o números identificatorios erradicados, ilegibles, modificados o borrados, es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Internamiento temporal del arma de fuego."},{"id":"b","text":"Multa."},{"id":"c","text":"Decomiso y cancelación de la licencia de uso de arma de fuego."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"A y B son correctas."}],"correct_answer":"c"},{"id":19,"type":"single_choice","question":"Según el Artículo 37 Inciso c) de la Ley 30299 portar armas con la cadencia el calibre o la potencia alteradas o modificadas, es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Internamiento temporal del arma de fuego."},{"id":"b","text":"Multa."},{"id":"c","text":"Decomiso y cancelación de la licencia de uso de arma de fuego."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"Internamiento por 90 días del arma de fuego."}],"correct_answer":"c"},{"id":20,"type":"single_choice","question":"Según el Artículo 37 literal g) de la Ley 30299 y Artículo 28 del Reglamento poseer, portar o usar armas de fuego sin licencia de uso, es una falta muy grave y se sanciona con:","options":[{"id":"a","text":"Internamiento temporal del arma de fuego."},{"id":"b","text":"Incautación."},{"id":"c","text":"Decomiso y cancelación de la licencia de uso de arma de fuego."},{"id":"d","text":"Multa y decomiso."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"d"},{"id":21,"type":"single_choice","question":"En el hogar las armas de fuego se deben guardar:","options":[{"id":"a","text":"Abastecidas y en un lugar seguro bajo llave."},{"id":"b","text":"Cargadas listas para ser usadas."},{"id":"c","text":"Descargadas y separadas de la munición."},{"id":"d","text":"En un lugar seguro bajo llave."},{"id":"e","text":"C y D son correctas."}],"correct_answer":"e"},{"id":22,"type":"single_choice","question":"En el hogar los miembros de la familia deben:","options":[{"id":"a","text":"Conocer los riesgos que existe al manipular un arma de fuego."},{"id":"b","text":"Aprender a usar el arma de fuego."},{"id":"c","text":"Aprender a disparar."},{"id":"d","text":"Tener la llave de la caja donde se guarda el arma."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"a"},{"id":23,"type":"single_choice","question":"En el hogar explicar a la familia especialmente a los niños en caso encuentren un arma de fuego procedan a:","options":[{"id":"a","text":"Que la dejen donde esté."},{"id":"b","text":"Que avisen a una persona adulta."},{"id":"c","text":"Que la lleven a su domicilio."},{"id":"d","text":"Que verifiquen si está cargada."},{"id":"e","text":"A y B son correctas."}],"correct_answer":"e"},{"id":24,"type":"single_choice","question":"En el manejo de la pistola cuál es la primera medida de seguridad a tener en cuenta:","options":[{"id":"a","text":"Rastrillar 3 veces la corredera de la pistola y percutar."},{"id":"b","text":"Verificar la recámara de la pistola."},{"id":"c","text":"Apuntar a un lugar seguro y retirar la cacerina de la pistola."},{"id":"d","text":"Disparar el arma a un sitio donde no se pueda lastimar a nadie."},{"id":"e","text":"Mirar por la boca del cañón."}],"correct_answer":"c"},{"id":25,"type":"single_choice","question":"En el manejo de cualquier arma que es lo primero que se debe hacer antes de manipularla:","options":[{"id":"a","text":"Mirar por la boca del cañón para verificar si el arma está cargada."},{"id":"b","text":"Apuntar el arma a un lugar seguro donde no pueda dañar a otras personas."},{"id":"c","text":"Desabastecer el arma de fuego."},{"id":"d","text":"Desensamblar el arma de fuego."},{"id":"e","text":"Presionar el disparador."}],"correct_answer":"b"},{"id":26,"type":"single_choice","question":"En el manejo del revolver cuál es la primera medida de seguridad a tener en cuenta:","options":[{"id":"a","text":"Presionar el disparador."},{"id":"b","text":"Apuntar a una persona."},{"id":"c","text":"Mirar por la boca del cañón."},{"id":"d","text":"Amartillar el arma de fuego."},{"id":"e","text":"Ninguna de las anteriores es correcta."}],"correct_answer":"e"},{"id":27,"type":"single_choice","question":"Marque la alternativa incorrecta en las medidas de seguridad en el manejo de una pistola:","options":[{"id":"a","text":"Apuntar a un lugar seguro donde no se pueda dañar a nadie."},{"id":"b","text":"No apuntar a algo o alguien al que no se quiera disparar."},{"id":"c","text":"Colocar el dedo en el disparador o gatillo sólo si se va a disparar. Verificar la recámara de la pistola."},{"id":"d","text":"Llevar simultáneamente el disparador y el martillo hacia delante."},{"id":"e","text":"Percutar la pistola para liberar el cartucho de la recámara."}],"correct_answer":"e"},{"id":28,"type":"single_choice","question":"En el manejo del revólver, si este se encuentra amartillado, que acción debe realizarse para no disparar el arma:","options":[{"id":"a","text":"Liberar el tambor del revolver."},{"id":"b","text":"Disparar hacia una zona segura."},{"id":"c","text":"Llevar hacia atrás el martillo."},{"id":"d","text":"Llevar simultáneamente el disparador y el martillo hacia delante."},{"id":"e","text":"Quitar la varilla extractora."}],"correct_answer":"d"},{"id":29,"type":"single_choice","question":"Las armas largas pueden ser usadas para la modalidad de defensa personal siempre que el solicitante habite en:","options":[{"id":"a","text":"Zona Urbana."},{"id":"b","text":"Zona Industrial."},{"id":"c","text":"Zona Rural."},{"id":"d","text":"Zona Residencial."},{"id":"e","text":"A y C son correctas."}],"correct_answer":"c"},{"id":30,"type":"single_choice","question":"Marque la respuesta correcta: (art. 25 del Reglamento de la Ley 30299)","options":[{"id":"a","text":"Para las armas de fuego de defensa personal se puede portar para uso inmediato hasta 70 setenta municiones."},{"id":"b","text":"Para las armas de fuego de defensa personal se puede portar para uso inmediato hasta 60 sesenta municiones."},{"id":"c","text":"Para las armas de fuego de defensa personal se puede portar para uso inmediato hasta 50 cincuenta municiones."},{"id":"d","text":"Para las armas de fuego de defensa personal se puede portar para uso inmediato hasta 80 ochenta municiones."},{"id":"e","text":"Para las armas de fuego de defensa personal se puede portar para uso inmediato hasta 90 noventa municiones."}],"correct_answer":"a"},{"id":31,"type":"single_choice","question":"Las licencias en la modalidad de defensa personal también son conocidas como:","options":[{"id":"a","text":"Licencia tipo A."},{"id":"b","text":"Licencia tipo B."},{"id":"c","text":"Licencia tipo L2."},{"id":"d","text":"Licencia tipo L1."},{"id":"e","text":"Luaspe."}],"correct_answer":"d"},{"id":32,"type":"single_choice","question":"Es un requisito para la licencia en la modalidad de defensa personal:","options":[{"id":"a","text":"Copia de la autorización expedida por SERFOR."},{"id":"b","text":"Constancia de acreditación emitida por una asociación o club de tiro reconocida por la Federación Deportiva Nacional."},{"id":"c","text":"Resolución emitida por el Ministerio de Cultura."},{"id":"d","text":"Expresión de motivos conforme a lo establecido en el numeral 7.11 del artículo 7 del Reglamento de la Ley 30299."},{"id":"e","text":"Declaración Jurada de la efectiva posesión del o las armas de fuego de su propiedad."}],"correct_answer":"d"},{"id":33,"type":"single_choice","question":"Las licencias en la modalidad de caza también son conocidas como:","options":[{"id":"a","text":"Licencia tipo B."},{"id":"b","text":"Licencia tipo L6."},{"id":"c","text":"Licencia tipo A."},{"id":"d","text":"Licencia tipo L2."},{"id":"e","text":"Licencia SERFOR."}],"correct_answer":"d"},{"id":34,"type":"single_choice","question":"Marque la alternativa correcta:","options":[{"id":"a","text":"Las armas de fuego en la modalidad de caza deben trasladarse descargadas y desabastecidas con el embalaje adecuado."},{"id":"b","text":"Está permitido el uso del arma de fuego bajo la modalidad de caza durante su traslado."},{"id":"c","text":"Está permitido usar el arma de la modalidad de defensa para la caza deportiva."},{"id":"d","text":"Sólo las armas largas están permitidas para actividades de caza deportiva."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"a"},{"id":35,"type":"single_choice","question":"Marque la alternativa correcta respecto a la modalidad de caza:","options":[{"id":"a","text":"La licencia de caza es igual o equivale a la licencia SERFOR."},{"id":"b","text":"La licencia de caza tiene una duración de 4 años."},{"id":"c","text":"Las personas naturales están obligadas a gestionar ante el Servicio Nacional Forestal y de Fauna Silvestre - SERFOR o los Gobiernos Regionales donde MINAGRI haya efectuado la transferencia de competencias en materia forestal y de fauna silvestre, la licencia vigente que demuestra su condición de cazadores."},{"id":"d","text":"La caza deportiva es autorizada por el Comando Conjunto de las Fuerzas Armadas."},{"id":"e","text":"Ninguna de las Anteriores es correcta."}],"correct_answer":"c"},{"id":36,"type":"single_choice","question":"El uso de las armas de fuego autorizadas en la modalidad de caza se encuentra permitido en:","options":[{"id":"a","text":"Galerías de tiro."},{"id":"b","text":"En áreas rurales y eriazas para efectos de calibración o entrenamiento."},{"id":"c","text":"En áreas rurales, eriazas ámbitos o zonas de cacería determinadas por la autoridad competente de acuerdo a la ley de la materia. Deben trasladarse descargadas y desabastecidas con el embalaje adecuado."},{"id":"d","text":"A y B son correctas."},{"id":"e","text":"Todas las anteriores son correctas."}],"correct_answer":"e"},{"id":37,"type":"single_choice","question":"Son Cartuchos y Municiones para las actividades de caza:","options":[{"id":"a","text":"Cartuchos no mayores a doce (12) GAUGE, con excepción de las municiones establecidas en la Cuarta Disposición Complementaria Transitoria de la Ley."},{"id":"b","text":"Cartuchos especiales con sustancia química para fines de conservación de fauna."},{"id":"c","text":"Municiones con proyectil de núcleo de acero."},{"id":"d","text":"A y B son correctas."},{"id":"e","text":"A, B y C son correctas."}],"correct_answer":"d"},{"id":38,"type":"single_choice","question":"Las licencias en la modalidad de deporte y tiro recreativo también son conocidas como:","options":[{"id":"a","text":"Licencia tipo L3."},{"id":"b","text":"Licencia tipo LD."},{"id":"c","text":"Licencia tipo D."},{"id":"d","text":"Licencia tipo LD3."},{"id":"e","text":"Licencia tipo FPT."}],"correct_answer":"a"},{"id":39,"type":"single_choice","question":"En la renovación de la licencia de deporte y tiro recreativo cual es el requisito que ya no se debe presentar:","options":[{"id":"a","text":"La evaluación teórica practica aprobada ante SUCAMEC."},{"id":"b","text":"La declaración Jurada de cumplir con las condiciones establecidas en el artículo 7 de la Ley."},{"id":"c","text":"El certificado de salud psicosomático para la obtención de licencias de arma de fuego, emitido por una IPRESS registrada en SUSALUD."},{"id":"d","text":"Constancia de acreditación que emita el club de tiro, la asociación deportiva u otra organización deportiva de tiro reconocida por la Federación Deportiva Nacional."},{"id":"e","text":"Resolución de la FPT reconociendo al solicitante como deportista calificado."}],"correct_answer":"e"},{"id":40,"type":"single_choice","question":"Marque la alternativa correcta respecto a la modalidad de deporte y tiro recreativo:","options":[{"id":"a","text":"El uso del arma de fuego de deporte se encuentra permitido durante su traslado."},{"id":"b","text":"Las armas de fuego autorizadas para la modalidad de deporte y tiro recreativo se usan para tiro de reacción."},{"id":"c","text":"Las armas de fuego autorizadas bajo la modalidad de deporte y tiro recreativo deben trasladarse descargadas, desabastecidas y con el embalaje adecuado."},{"id":"d","text":"Las armas de fuego autorizadas para la modalidad de deporte y tiro recreativo se pueden usar en la modalidad de defensa personal en zona rural."},{"id":"e","text":"Ninguna de las anteriores es correcta."}],"correct_answer":"c"},{"id":41,"type":"single_choice","question":"No es un requisito para la modalidad de colección:","options":[{"id":"a","text":"Declaración Jurada de la efectiva posesión del o las armas de fuego de su propiedad."},{"id":"b","text":"Formulario de solicitud debidamente suscrito y firmado."},{"id":"c","text":"Exhibir documento de identidad vigente y legible o copia del carné de extranjería vigente y legible."},{"id":"d","text":"Resolución emitida por el Ministerio de Cultura para Coleccionistas."},{"id":"e","text":"Haber aprobado la evaluación Teórico Practica ante la SUCAMEC."}],"correct_answer":"d"},{"id":42,"type":"single_choice","question":"Marque la respuesta correcta respecto a la modalidad de colección:","options":[{"id":"a","text":"Las armas de colección requieren contar con tarjeta de propiedad exceptuándose el requisito del número de identificación a las armas manufacturadas en el año 1898 o antes."},{"id":"b","text":"Las armas de fuego de colección pueden ser usadas en la modalidad de caza."},{"id":"c","text":"La SUCAMEC no autoriza el traslado de armas de fuego de colección con fines didácticos."},{"id":"d","text":"Son armas de colección aquellas fabricadas hasta el año 1888."},{"id":"e","text":"No está permitido la compra y uso de municiones para el arma de fuego de colección."}],"correct_answer":"a"},{"id":43,"type":"single_choice","question":"Cuál es el requisito adicional para la modalidad de colección:","options":[{"id":"a","text":"Declaración Jurada de la Efectiva posesión de las armas de su propiedad."},{"id":"b","text":"Resolución del Ministerio de Cultura reconociendo al solicitante como coleccionista."},{"id":"c","text":"Constancia de una asociación o club de coleccionistas acreditado debidamente en el ministerio de Cultura."},{"id":"d","text":"Certificado temporal donde se acredite la fecha de fabricación del arma de fuego, mediante prueba de carbono emitido por la Dirección de Criminalística de la Policía Nacional."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"a"},{"id":44,"type":"single_choice","question":"Marque la Respuesta Correcta respecto a las armas de colección:","options":[{"id":"a","text":"Deben permanecer descargadas y desabastecidas, asimismo debe desmontarse el mecanismo de disparo si sus características lo permiten, salvo fines didácticos o de exhibición."},{"id":"b","text":"El porte de las armas de colección se encuentra permitido."},{"id":"c","text":"La compra y uso de municiones para el arma de fuego de colección está permitido en galerías de tiro o para fines de exhibición."},{"id":"d","text":"A y C son correctas."},{"id":"e","text":"Todas son correctas."}],"correct_answer":"d"},{"id":45,"type":"single_choice","question":"Las licencias en la modalidad de seguridad privada son conocidas como:","options":[{"id":"a","text":"Licencia tipo C."},{"id":"b","text":"Licencia tipo L3."},{"id":"c","text":"Licencia tipo L6."},{"id":"d","text":"Licencia tipo L4."},{"id":"e","text":"Licencia tipo Colección."}],"correct_answer":"d"},{"id":46,"type":"single_choice","question":"Las licencias en la modalidad colección son conocidas como:","options":[{"id":"a","text":"Licencia tipo S."},{"id":"b","text":"Licencia tipo LS."},{"id":"c","text":"Licencia tipo L6."},{"id":"d","text":"Licencia tipo L5S."},{"id":"e","text":"Licencia tipo Sispe."}],"correct_answer":"c"},{"id":47,"type":"single_choice","question":"Marque la respuesta correcta respecto a la renovación de licencia Sispe:","options":[{"id":"a","text":"Para la renovación de licencia del personal de seguridad estos deberán adjuntar los mismos requisitos exigidos para el trámite de licencia inicial."},{"id":"b","text":"Para la renovación de licencia del personal de seguridad ya no deberá adjuntar el requisito de evaluación teórico práctica."},{"id":"c","text":"Para la renovación de licencia del personal de seguridad ya no deberá adjuntar el requisito de certificado de salud psicosomático."},{"id":"d","text":"Para la renovación de licencia del personal de seguridad ya no deberá adjuntar el requisito de archivo con foto digitalizada."},{"id":"e","text":"Para la renovación de licencia del personal de seguridad ya no deberá adjuntar el requisito de verificación de arma de fuego."}],"correct_answer":"a"},{"id":48,"type":"single_choice","question":"Marque la alternativa incorrecta respecto a los requisitos para la licencia Sispe:","options":[{"id":"a","text":"Solicitud debidamente suscrita y firmada por el solicitante."},{"id":"b","text":"Haber aprobado la evaluación teórica practica ante la SUCAMEC."},{"id":"c","text":"Declaración Jurada de cumplir con las condiciones establecidas en el artículo 7 de la Ley, de acuerdo al formulario aprobado por SUCAMEC."},{"id":"d","text":"Copia del Carnet de personal de seguridad emitido por la Gerencia de Servicio de Seguridad Privada."},{"id":"e","text":"Copia del comprobante que acredite el pago correspondiente por el trámite, indicando número de RUC vigente del solicitante."}],"correct_answer":"d"},{"id":49,"type":"single_choice","question":"Según el Artículo 15 de la Ley 30299 el personal de seguridad puede usar:","options":[{"id":"a","text":"Pistolas."},{"id":"b","text":"Revólveres."},{"id":"c","text":"Escopetas."},{"id":"d","text":"Carabinas."},{"id":"e","text":"Todas las anteriores son correctas."}],"correct_answer":"e"},{"id":50,"type":"single_choice","question":"El calibre en las armas de fuego se mide:","options":[{"id":"a","text":"En el diámetro interior del cañón de las armas de fuego."},{"id":"b","text":"En el diámetro exterior del cañón de las armas de fuego."},{"id":"c","text":"En el diámetro exterior de los casquillos."},{"id":"d","text":"En la recámara."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"a"},{"id":51,"type":"single_choice","question":"Cuál de los siguientes calibres NO es considerado calibre de escopeta:","options":[{"id":"a","text":"410 mm."},{"id":"b","text":"16 GA."},{"id":"c","text":"12 GA."},{"id":"d","text":"10 GA."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"e"},{"id":52,"type":"single_choice","question":"Es una medida de seguridad en el manejo de la escopeta:","options":[{"id":"a","text":"No dirigir el cañón a otra persona, así estuviera descargada."},{"id":"b","text":"Presumir que el arma siempre se encuentra cargada."},{"id":"c","text":"Trasladar el arma cargada en un embalaje adecuado."},{"id":"d","text":"A y B son correctas."},{"id":"e","text":"B y C son correctas."}],"correct_answer":"d"},{"id":53,"type":"single_choice","question":"¿Qué es lo que nunca debemos hacer cuando desconozcamos el funcionamiento de una escopeta?:","options":[{"id":"a","text":"Percutar para verificar que no esté cargada."},{"id":"b","text":"Manipularla."},{"id":"c","text":"Guardarla en su funda."},{"id":"d","text":"A y B son correctas."},{"id":"e","text":"Todas las anteriores."}],"correct_answer":"d"},{"id":54,"type":"single_choice","question":"¿Cuántos golpes de seguridad es recomendable con la escopeta luego de cerciorarte que no hay munición en la recámara?:","options":[{"id":"a","text":"2 golpes."},{"id":"b","text":"1 golpe."},{"id":"c","text":"3 golpes."},{"id":"d","text":"4 golpes."},{"id":"e","text":"Ningún golpe."}],"correct_answer":"c"},{"id":55,"type":"single_choice","question":"La escopeta es considerada como:","options":[{"id":"a","text":"Arma corta."},{"id":"b","text":"Arma Larga."},{"id":"c","text":"Arma individual."},{"id":"d","text":"Arma colectiva."},{"id":"e","text":"B y C son Correctas."}],"correct_answer":"e"},{"id":56,"type":"single_choice","question":"Según su funcionamiento las escopetas autorizadas para uso civil pueden ser:","options":[{"id":"a","text":"Automáticas."},{"id":"b","text":"Semiautomática."},{"id":"c","text":"Tiro por tiro."},{"id":"d","text":"B y C son correctas."},{"id":"e","text":"Todas las anteriores."}],"correct_answer":"d"},{"id":57,"type":"single_choice","question":"Las escopetas de caza generalmente tienen el ánima:","options":[{"id":"a","text":"Rayada."},{"id":"b","text":"Estriada."},{"id":"c","text":"Lisa."},{"id":"d","text":"A y C son correctas."},{"id":"e","text":"Ninguna de las anteriores."}],"correct_answer":"c"},{"id":     class SucamecQuiz {
      constructor(data) {
        console.log('Datos recibidos:', data);
        console.log('Preguntas crudas:', data.questions);
        console.log('Tipo de data.questions:', typeof data.questions);
        console.log('Es array:', Array.isArray(data.questions));
        
        // Validar y filtrar preguntas válidas (single_choice y true_false)
        this.questions = (data.questions || []).filter((question, index) => {
          console.log(`Pregunta ${index}:`, question);
          
          let isValid = question && 
            question.id && 
            question.question && 
            question.correct_answer !== undefined;
          
          // Validación específica según el tipo
          if (question.type === 'single_choice') {
            isValid = isValid && 
              question.options && 
              Array.isArray(question.options) &&
              question.options.length > 0;
          } else if (question.type === 'true_false') {
            // Para true_false, no se requiere options
            isValid = isValid && 
              (question.correct_answer === true || question.correct_answer === false);
          } else {
            // Tipo desconocido
            isValid = false;
          }
          
          if (!isValid) {
            console.error(`Pregunta inválida ${index}:`, question);
          }
          
          return isValid;
        });
        
        if (this.questions.length === 0) {
          console.error('No hay preguntas válidas en el JSON');
        }
        
        this.currentMode = null;
        this.currentQuestions = [];
        this.currentQuestionIndex = 0;
        this.userAnswers = {};
        this.isCompleted = false;
        this.history = this.loadHistory();
        this.timerInterval = null;
        this.timeLeft = 0;

        // Atajos de teclado
        this.handleKeyDown = this.handleKeyDown.bind(this);
        window.addEventListener('keydown', this.handleKeyDown);

        // Intentar restaurar sesión previa
        this.loadState();
      }

      handleKeyDown(e) {
        // Solo actuar si estamos en un cuestionario activo y no completado
        if (!document.querySelector('.quiz-container') || this.isCompleted) return;

        // Teclas 1, 2, 3, 4 para opciones
        if (e.key >= '1' && e.key <= '4') {
          const index = parseInt(e.key) - 1;
          const options = document.querySelectorAll('.option-item input[type="radio"]');
          if (options[index] && !options[index].disabled) {
            options[index].click();
          }
        }

        // Enter para Siguiente / Finalizar
        if (e.key === 'Enter') {
          const nextBtn = document.querySelector('.navigation button:last-child');
          if (nextBtn && !nextBtn.disabled) {
            nextBtn.click();
          }
        }
      }

      loadHistory() {
        const saved = localStorage.getItem('sucamec_history');
        return saved ? JSON.parse(saved) : [];
      }

      saveHistory(result) {
        this.history.unshift({
          ...result,
          date: new Date().toLocaleString(),
          id: Date.now()
        });
        // Solo guardar los últimos 10 intentos
        this.history = this.history.slice(0, 10);
        localStorage.setItem('sucamec_history', JSON.stringify(this.history));
      }

      saveState() {
        if (this.isCompleted) {
          localStorage.removeItem('sucamec_quiz_state');
          return;
        }

        const state = {
          currentMode: this.currentMode,
          currentQuestions: this.currentQuestions,
          currentQuestionIndex: this.currentQuestionIndex,
          userAnswers: this.userAnswers
        };
        localStorage.setItem('sucamec_quiz_state', JSON.stringify(state));
      }

      loadState() {
        const saved = localStorage.getItem('sucamec_quiz_state');
        if (saved) {
          try {
            const state = JSON.parse(saved);
            this.currentMode = state.currentMode;
            this.currentQuestions = state.currentQuestions;
            this.currentQuestionIndex = state.currentQuestionIndex;
            this.userAnswers = state.userAnswers;
            return true;
          } catch (e) {
            console.error('Error cargando estado:', e);
          }
        }
        return false;
      }

      clearState() {
        localStorage.removeItem('sucamec_quiz_state');
      }

      init() {
        // Si hay un estado guardado, preguntar si desea continuar
        if (this.currentMode && this.currentQuestions.length > 0 && !this.isCompleted) {
          this.renderResumePrompt();
        } else {
          this.renderModeSelector();
        }
      }

      renderResumePrompt() {
        const content = document.getElementById('app-content');
        content.innerHTML = `
          <div class="resume-prompt bg-skin-card p-8 rounded-lg border border-skin-border text-center">
            <h2 class="text-2xl font-semibold mb-4">¿Continuar sesión anterior?</h2>

      }

      getModeName(mode) {
        const names = {
          'viewAll': 'Ver Banco Completo',
          'simulate': 'Simulacro SUCAMEC',
          'fullQuiz': 'Cuestionario Completo',
          'custom': 'Cuestionario Personalizado',
          'history': 'Historial de Resultados'
        };
        return names[mode] || mode;
      }

      resetAndStart() {
        this.stopTimer();
        this.clearState();
        this.currentMode = null;
        this.currentQuestions = [];
        this.currentQuestionIndex = 0;
        this.userAnswers = {};
        this.renderModeSelector();
      }

      renderHistory() {
        const content = document.getElementById('app-content');
        let historyHtml = '';
        
        if (this.history.length === 0) {
          historyHtml = '<p class="text-center text-skin-muted py-8">No hay resultados previos en esta sesión.</p>';
        } else {
          historyHtml = `
            <div class="space-y-4 max-h-[400px] overflow-y-auto mb-6 pr-2">
              ${this.history.map(item => `
                <div class="flex justify-between items-center p-4 bg-skin-fill/50 rounded-lg border border-skin-border">
                  <div class="text-left">
                    <div class="font-semibold">${this.getModeName(item.mode)}</div>
                    <div class="text-xs text-skin-muted">${item.date}</div>

                  <div class="text-right">

                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }

        content.innerHTML = `
          <div class="history-view bg-skin-card p-8 rounded-lg border border-skin-border">

      startMode(mode) {
        this.currentMode = mode;
        this.currentQuestionIndex = 0;
        this.userAnswers = {};
        this.isCompleted = false;

        switch(mode) {
          case 'viewAll':
            this.currentQuestions = [...this.questions];
            this.renderViewAll();
            break;
          case 'simulate':
            this.currentQuestions = this.getRandomQuestions(5);
            this.startTimer(10 * 60); // 10 minutos para el simulacro de 5 preguntas
            this.saveState();
            this.renderQuiz();
            break;
          case 'fullQuiz':
            // Ahora también aleatorio como pidió el usuario
            this.currentQuestions = this.getRandomQuestions(this.questions.length);
            this.saveState();
            this.renderQuiz();
            break;
          case 'custom':
            this.renderCustomInput();
            break;
          case 'history':
            this.renderHistory();
            break;
        }
      }

                  <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 17a1 1 0 011 1v1a1 1 0 01-1H4a1 1 0 01-1V4a1 1 0 01-1H3a1 1 0 01-1zm7 7a1 1 0 011 1v6a1 1 0 01-1h-6a1 1 0 01-1V8a1 1 0 01-1z"/>
                  </svg>
                  Descargar PDF
                </a>
                
                <button 
                  onclick="window.quiz.openPDFInNewTab()" 
                  class="inline-flex items-center px-4 py-2 bg-skin-card border border-skin-border rounded-lg hover:border-skin-accent transition-colors"
                >
                  Abrir en nueva pestaña
                </button>
              </div>
            </div>
          </div>
        `;
      }

      openPDFInNewTab() {
        // Abrir el PDF en una nueva pestaña (opción alternativa)
        window.open('/pdfs/sucamec_desmontaje.pdf', '_blank');
      }

      getRandomQuestions(count) {
        const shuffled = [...this.questions].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, count);
      }

      renderViewAll() {
        const content = document.getElementById('app-content');
        let html = `
          <div class="view-all">
            <div class="flex justify-between items-center mb-6 sticky top-0 bg-skin py-4 z-10 border-b border-skin-border">
              <h2 class="text-2xl font-semibold">Banco Completo (${this.questions.length} preguntas)</h2>
              <button onclick="window.quiz.init()" class="text-skin-muted hover:text-skin-accent transition-colors">
                ← Volver al menú
              </button>
            </div>
        `;

        // Para Ver Banco Completo, pre-marcar las respuestas correctas
        this.currentQuestions.forEach((q, index) => {
          // Temporalmente guardar la respuesta correcta como si el usuario la hubiera seleccionado
          const originalAnswer = this.userAnswers[q.id];
          // Para true_false, convertir booleano a string
          if (q.type === 'true_false') {
            this.userAnswers[q.id] = q.correct_answer.toString();
          } else {
            this.userAnswers[q.id] = q.correct_answer;
          }
          
          html += this.renderQuestion(q, index, true);
          
          // Restaurar la respuesta original (si existía)
          if (originalAnswer !== undefined) {
            this.userAnswers[q.id] = originalAnswer;
          } else {
            delete this.userAnswers[q.id];
          }
        });

        html += '</div>';
        content.innerHTML = html;
      }

      renderQuiz() {
        const content = document.getElementById('app-content');
        const progress = `${this.currentQuestionIndex + 1} de ${this.currentQuestions.length}`;
        const timerHtml = this.currentMode === 'simulate' ? `
          <div id="quiz-timer" class="flex items-center gap-2 px-3 py-1 bg-skin-accent/10 border border-skin-accent/20 rounded-full font-mono text-skin-accent font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="timer-display">--:--</span>
          </div>
        ` : '';
        
        content.innerHTML = `
          <div class="quiz-container">
            <div class="flex justify-between items-center mb-6">
              <div class="flex items-center gap-4">
                <h2 class="text-xl font-semibold">Pregunta ${progress}</h2>
                ${timerHtml}
              </div>
              <button onclick="window.quiz.resetAndStart()" class="text-skin-muted hover:text-skin-accent transition-colors flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                Abandonar
              </button>
            </div>
            
            <div class="progress-bar mb-6">
              <div class="w-full bg-skin-border rounded-full h-2">
                <div class="bg-skin-accent h-2 rounded-full transition-all duration-300" style="width: ${((this.currentQuestionIndex + 1) / this.currentQuestions.length) * 100}%"></div>
              </div>
            </div>
            
            ${this.renderQuestion(this.currentQuestions[this.currentQuestionIndex], this.currentQuestionIndex, false)}
            
            <div class="navigation flex flex-col items-center gap-4 mt-8">
              <div id="validation-msg" class="text-red-500 text-sm font-medium h-5 opacity-0 transition-opacity">
                Por favor selecciona una alternativa
              </div>
              <div class="flex justify-between w-full">
                <button 
                  onclick="window.quiz.previousQuestion()" 
                  ${this.currentQuestionIndex === 0 ? 'disabled' : ''}
                  class="px-4 py-2 bg-skin-card border border-skin-border rounded hover:border-skin-accent transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  ← Anterior
                </button>
                
                ${this.currentQuestionIndex === this.currentQuestions.length - 1 ? 
                  `<button onclick="window.quiz.finishQuiz()" class="px-6 py-2 bg-skin-accent text-white rounded hover:bg-opacity-90 transition-colors">
                    Finalizar
                  </button>` :
                  `<button onclick="window.quiz.nextQuestion()" class="px-4 py-2 bg-skin-accent text-white rounded hover:bg-opacity-90 transition-colors">
                    Siguiente →
                  </button>`
                }
              </div>
            </div>
          </div>
        `;

        if (this.currentMode === 'simulate') {
          this.updateTimerDisplay();
        }

        // Restaurar respuesta guardada si existe
        const questionId = this.currentQuestions[this.currentQuestionIndex].id;
        if (this.userAnswers[questionId]) {
          const radio = document.querySelector(`input[name="answer_${questionId}"][value="${this.userAnswers[questionId]}"]`);
          if (radio) radio.checked = true;
        }

        // Scroll suave hacia arriba al cambiar pregunta
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      startTimer(seconds) {
        this.timeLeft = seconds;
        if (this.timerInterval) clearInterval(this.timerInterval);
        
        this.timerInterval = setInterval(() => {
          this.timeLeft--;
          this.updateTimerDisplay();
          
          if (this.timeLeft <= 0) {
            clearInterval(this.timerInterval);
            alert('¡Tiempo agotado!');
            this.finishQuiz();
          }
        }, 1000);
      }

      updateTimerDisplay() {
        const display = document.getElementById('timer-display');
        if (!display) return;
        
        const minutes = Math.floor(this.timeLeft / 60);
        const seconds = this.timeLeft % 60;
        display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        // Poner en rojo si queda menos de un minuto
        if (this.timeLeft < 60) {
          display.parentElement.classList.add('animate-pulse', 'text-red-600', 'border-red-600', 'bg-red-50');
        }
      }

      stopTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }

      renderQuestion(question, index, showAnswer) {
        // Validar que la pregunta tenga las propiedades necesarias
        if (!question || !question.question) {
          return '<div class="error">Error: Pregunta no válida</div>';
        }

        let optionsHtml = '';
        
        if (question.type === 'single_choice') {
          // Validar opciones para single_choice
          if (!question.options || !Array.isArray(question.options)) {
            return '<div class="error">Error: Pregunta sin opciones válidas</div>';
          }

          const isCorrect = (optionId) => optionId === question.correct_answer;
          
          question.options.forEach(option => {
            const correct = isCorrect(option.id);
            const selected = this.userAnswers[question.id] === option.id;
            
            let optionClass = 'option-item p-4 rounded-lg mb-3 cursor-pointer border border-skin-border transition-all hover:border-skin-accent flex items-start gap-3';
            
            // En Ver Banco Completo, solo marcar el radio button sin colores
            if (showAnswer && this.currentMode === 'viewAll') {
              // No agregar colores, solo mantener el estilo normal
            } else if (showAnswer && this.isCompleted) {
              // En revisión final, mostrar colores
              if (correct) {
                optionClass += ' is-correct bg-green-50 text-green-800 dark:bg-green-900/10 dark:text-green-400 border-green-200';
              } else if (selected && !correct) {
                optionClass += ' is-incorrect bg-red-50 text-red-800 dark:bg-red-900/10 dark:text-red-400 border-red-200';
              }
            } else if (selected) {
              optionClass += ' border-skin-accent bg-skin-accent/5';
            }
            
            optionsHtml += `
              <label class="${optionClass}">
                <input 
                  type="radio" 
                  name="answer_${question.id}" 
                  value="${option.id}"
                  ${showAnswer ? 'disabled' : ''}
                  onchange="window.quiz.saveAnswer(${question.id}, '${option.id}')"
                  class="mt-1"
                  ${selected ? 'checked' : ''}
                >
                <div class="flex-1">
                  <span class="block">${option.text}</span>
                  ${showAnswer && this.isCompleted && correct ? '<span class="feedback-text text-xs font-bold text-green-600 dark:text-green-400 mt-1 block">✓ RESPUESTA CORRECTA</span>' : ''}
                  ${showAnswer && this.isCompleted && selected && !correct ? '<span class="feedback-text text-xs font-bold text-red-600 dark:text-red-400 mt-1 block">✗ TU SELECCIÓN (INCORRECTA)</span>' : ''}
                </div>
              </label>
            `;
          });
        } else if (question.type === 'true_false') {
          // Opciones para verdadero/falso
          const selectedValue = this.userAnswers[question.id];
          // Asegurar que la comparación funcione con booleanos y strings
          const isCorrect = (value) => {
            if (typeof question.correct_answer === 'boolean') {
              return value === question.correct_answer.toString();
            }
            return value === question.correct_answer;
          };
          
          ['true', 'false'].forEach(value => {
            const correct = isCorrect(value);
            const selected = selectedValue === value;
            const label = value === 'true' ? 'Verdadero' : 'Falso';
            
            let optionClass = 'option-item p-4 rounded-lg mb-3 cursor-pointer border border-skin-border transition-all hover:border-skin-accent flex items-start gap-3';
            
            // En Ver Banco Completo, solo marcar el radio button sin colores
            if (showAnswer && this.currentMode === 'viewAll') {
              // No agregar colores, solo mantener el estilo normal
            } else if (showAnswer && this.isCompleted) {
              // En revisión final, mostrar colores
              if (correct) {
                optionClass += ' is-correct bg-green-50 text-green-800 dark:bg-green-900/10 dark:text-green-400 border-green-200';
              } else if (selected && !correct) {
                optionClass += ' is-incorrect bg-red-50 text-red-800 dark:bg-red-900/10 dark:text-red-400 border-red-200';
              }
            } else if (selected) {
              optionClass += ' border-skin-accent bg-skin-accent/5';
            }
            
            optionsHtml += `
              <label class="${optionClass}">
                <input 
                  type="radio" 
                  name="answer_${question.id}" 
                  value="${value}"
                  ${showAnswer ? 'disabled' : ''}
                  onchange="window.quiz.saveAnswer(${question.id}, '${value}')"
                  class="mt-1"
                  ${selected ? 'checked' : ''}
                >
                <div class="flex-1">
                  <span class="block">${label}</span>
                  ${showAnswer && this.isCompleted && correct ? '<span class="feedback-text text-xs font-bold text-green-600 dark:text-green-400 mt-1 block">✓ CORRECTO</span>' : ''}
                  ${showAnswer && this.isCompleted && selected && !correct ? '<span class="feedback-text text-xs font-bold text-red-600 dark:text-red-400 mt-1 block">✗ TU SELECCIÓN (INCORRECTO)</span>' : ''}
                </div>
              </label>
            `;
          });
        }

        return `
          <div class="question-card bg-skin-card p-6 rounded-lg border border-skin-border mb-8 shadow-sm">
            <div class="mb-4">
              <span class="text-sm text-skin-muted">Pregunta ${index + 1} - ${question.type === 'true_false' ? 'Verdadero/Falso' : 'Opción única'}</span>
            </div>
            <h3 class="text-lg font-medium mb-6">${question.question}</h3>
            <div class="options">
              ${optionsHtml}
            </div>
          </div>
        `;
      }

      saveAnswer(questionId, answerId) {
        this.userAnswers[questionId] = answerId;
        this.saveState();
        // Ocultar mensaje de validación si estaba visible
        const msg = document.getElementById('validation-msg');
        if (msg) msg.classList.add('opacity-0');
      }

      nextQuestion() {
        const currentQuestion = this.currentQuestions[this.currentQuestionIndex];
        const userAnswer = this.userAnswers[currentQuestion.id];
        
        // Validar que se haya respondido la pregunta actual
        if (!userAnswer) {
          const msg = document.getElementById('validation-msg');
          if (msg) {
            msg.classList.remove('opacity-0');
            msg.classList.add('opacity-100');
          }
          return;
        }
        
        // Mostrar retroalimentación de la respuesta actual
        this.showAnswerFeedback();
        
        // Esperar un momento y luego avanzar
        setTimeout(() => {
          if (this.currentQuestionIndex < this.currentQuestions.length - 1) {
            this.currentQuestionIndex++;
            this.saveState();
            this.renderQuiz();
          }
        }, 1500); // 1.5 segundos para ver la retroalimentación
      }

      showAnswerFeedback() {
        const currentQuestion = this.currentQuestions[this.currentQuestionIndex];
        const userAnswer = this.userAnswers[currentQuestion.id];
        
        // Aplicar estilos de retroalimentación
        const options = document.querySelectorAll(`input[name="answer_${currentQuestion.id}"]`);
        options.forEach(option => {
          const label = option.closest('label');
          const optionValue = option.value;
          const correct = (currentQuestion.type === 'true_false') 
            ? (typeof currentQuestion.correct_answer === 'boolean' 
               ? optionValue === currentQuestion.correct_answer.toString()
               : optionValue === currentQuestion.correct_answer)
            : optionValue === currentQuestion.correct_answer;
          const selected = optionValue === userAnswer;
          
          // Limpiar clases de estado previo
          label.classList.remove('border-skin-accent', 'bg-skin-accent/5');
          
          // Aplicar clases de feedback
          if (correct) {
            label.classList.add('is-correct', 'bg-green-50', 'text-green-800', 'dark:bg-green-900/10', 'dark:text-green-400', 'border-green-200');
            // Agregar texto de feedback
            const container = label.querySelector('.flex-1');
            if (container && !container.querySelector('.feedback-text')) {
              container.insertAdjacentHTML('beforeend', '<span class="feedback-text text-xs font-bold text-green-600 dark:text-green-400 mt-1 block animate-bounce-short">✓ RESPUESTA CORRECTA</span>');
            }
          } else if (selected && !correct) {
            label.classList.add('is-incorrect', 'bg-red-50', 'text-red-800', 'dark:bg-red-900/10', 'dark:text-red-400', 'border-red-200');
            // Agregar texto de feedback
            const container = label.querySelector('.flex-1');
            if (container && !container.querySelector('.feedback-text')) {
              container.insertAdjacentHTML('beforeend', '<span class="feedback-text text-xs font-bold text-red-600 dark:text-red-400 mt-1 block animate-shake">✗ TU SELECCIÓN (INCORRECTA)</span>');
            }
          }
          
          // Deshabilitar todos los inputs
          option.disabled = true;
        });
      }

      previousQuestion() {
        if (this.currentQuestionIndex > 0) {
          this.currentQuestionIndex--;
          this.saveState();
          this.renderQuiz();
        }
      }

      finishQuiz() {
        const currentQuestion = this.currentQuestions[this.currentQuestionIndex];
        const userAnswer = this.userAnswers[currentQuestion.id];
        
        if (!userAnswer) {
          const msg = document.getElementById('validation-msg');
          if (msg) {
            msg.classList.remove('opacity-0');
            msg.classList.add('opacity-100');
          }
          return;
        }

        this.showAnswerFeedback();
        this.stopTimer();
        
        setTimeout(() => {
          this.isCompleted = true;
          this.clearState();
          this.renderResults();
        }, 1500);
      }

      renderResults() {
        let correct = 0;
        
        this.currentQuestions.forEach(question => {
          const userAnswer = this.userAnswers[question.id];
          if (userAnswer !== undefined) {
            if (question.type === 'true_false') {
              if (typeof question.correct_answer === 'boolean') {
                if (userAnswer === question.correct_answer.toString()) {
                  correct++;
                }
              } else {
                if (userAnswer === question.correct_answer) {
                  correct++;
                }
              }
            } else {
              if (userAnswer === question.correct_answer) {
                correct++;
              }
            }
          }
        });
        
        const total = this.currentQuestions.length;
        const percentage = Math.round((correct / total) * 100);
        const passed = percentage >= 70;

        // Guardar en el historial
        this.saveHistory({
          mode: this.currentMode,
          total: total,
          correct: correct,
          percentage: percentage
        });

        const content = document.getElementById('app-content');
        content.innerHTML = `
          <div class="results bg-skin-card p-8 rounded-lg border border-skin-border text-center max-w-2xl mx-auto shadow-2xl">
            <div class="mb-4 inline-block px-4 py-1 rounded-full text-xs font-bold tracking-widest ${passed ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'}">
              ${passed ? '¡FELICITACIONES!' : 'NECESITAS REPASAR'}
            </div>
            
            <h2 class="text-4xl font-bold mb-2">${passed ? 'Has aprobado el simulacro' : 'No has alcanzado el mínimo'}</h2>
            <p class="text-skin-muted mb-8">${passed ? 'Estás listo para el examen real de SUCAMEC.' : 'Te recomendamos revisar el banco completo de preguntas e intentarlo de nuevo.'}</p>
            
            <div class="flex flex-col items-center mb-10">
              <div class="text-7xl font-bold mb-2 ${passed ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                ${percentage}%
              </div>
              <div class="text-lg text-skin-muted">
                Has acertado <strong>${correct}</strong> de <strong>${total}</strong> preguntas
              </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
              <button 
                onclick="window.quiz.viewReview()" 
                class="px-6 py-4 bg-skin-accent text-white rounded-xl hover:bg-opacity-90 transition-all font-bold flex items-center justify-center gap-2"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                Ver revisión
              </button>
              <button 
                onclick="window.quiz.copyResults(${percentage}, ${correct}, ${total})" 
                id="copy-results-btn"
                class="px-6 py-4 bg-skin-card border border-skin-border rounded-xl hover:border-skin-accent transition-all font-bold text-skin-base flex items-center justify-center gap-2"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
                Compartir resultado
              </button>
            </div>

            <button 
              onclick="window.quiz.init()" 
              class="text-skin-muted hover:text-skin-accent transition-colors font-medium border-b border-transparent hover:border-skin-accent"
            >
              Volver al menú principal
            </button>
          </div>
        `;
      }

      async copyResults(percentage, correct, total) {
        const text = `🎯 He logrado un ${percentage}% (${correct}/${total} aciertos) en el Simulador SUCAMEC 2026. ¡Practica tú también aquí! ${window.location.href}`;
        try {
          await navigator.clipboard.writeText(text);
          const btn = document.getElementById('copy-results-btn');
          const originalText = btn.innerHTML;
          btn.innerHTML = '¡Copiado!';
          btn.classList.add('text-green-600', 'border-green-600');
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('text-green-600', 'border-green-600');
          }, 2000);
        } catch (err) {
          console.error('Error al copiar:', err);
        }
      }

      viewReview() {
        const content = document.getElementById('app-content');
        let html = `
          <div class="review">
            <div class="flex justify-between items-center mb-6 sticky top-0 bg-skin py-4 z-10 border-b border-skin-border">
              <h2 class="text-2xl font-semibold">Revisión del Examen</h2>
              <div class="flex gap-4">
                <button onclick="window.quiz.renderResults()" class="text-skin-muted hover:text-skin-accent transition-colors">
                  ← Resultados
                </button>
                <button onclick="window.quiz.init()" class="text-skin-muted hover:text-skin-accent transition-colors">
                  Menú
                </button>
              </div>
            </div>
        `;

        this.currentQuestions.forEach((q, index) => {
          const userAnswer = this.userAnswers[q.id];
          // Asegurar comparación correcta entre strings y booleanos
          const isCorrect = () => {
            if (q.type === 'true_false') {
              if (typeof q.correct_answer === 'boolean') {
                return userAnswer === q.correct_answer.toString();
              }
              return userAnswer === q.correct_answer;
            }
            return userAnswer === q.correct_answer;
          };
          
          // Función para obtener texto de respuesta según tipo
          const getAnswerText = (answer) => {
            if (q.type === 'single_choice') {
              return q.options.find(opt => opt.id === answer)?.text || 'No respondida';
            } else if (q.type === 'true_false') {
              if (answer === 'true' || answer === true) return 'Verdadero';
              if (answer === 'false' || answer === false) return 'Falso';
              return 'No respondida';
            }
            return 'No respondida';
          };
          
          html += `
            <div class="question-review bg-skin-card p-6 rounded-lg border border-skin-border mb-4">
              <div class="flex items-center justify-between mb-4">
                <span class="text-sm text-skin-muted">Pregunta ${index + 1} - ${q.type === 'true_false' ? 'Verdadero/Falso' : 'Opción única'}</span>
                <span class="px-3 py-1 rounded-full text-sm font-medium ${
                  isCorrect() 
                    ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' 
                    : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'
                }" style="${!isCorrect() ? 'background-color: #fef2f2; color: #991b1b;' : ''}">
                  ${isCorrect() ? '✓ Correcta' : '✗ Incorrecta'}
                </span>
              </div>
              
              <h3 class="font-medium mb-4">${q.question}</h3>
              
              <div class="space-y-2 mb-4">
                <div class="text-sm">
                  <span class="font-medium">Tu respuesta: </span>
                  <span class="${isCorrect() ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                    ${getAnswerText(userAnswer)}
                  </span>
                </div>
                ${!isCorrect() ? `
                  <div class="text-sm">
                    <span class="font-medium">Respuesta correcta: </span>
                    <span class="text-green-600 dark:text-green-400">
                      ${getAnswerText(q.correct_answer)}
                    </span>
                  </div>
                ` : ''}
              </div>
              
              <div class="mt-4 pt-4 border-t border-skin-border">
                <div class="text-sm font-medium mb-2 text-skin-muted">Todas las opciones:</div>
                <div class="space-y-1">
                  ${q.type === 'single_choice' ? 
                    q.options.map(option => {
                      const isCorrectOption = option.id === q.correct_answer;
                      const isSelectedOption = option.id === userAnswer;
                      
                      let optionClass = 'p-2 rounded text-sm ';
                      if (isCorrectOption) {
                        optionClass += 'bg-green-50 text-green-800 dark:bg-green-900/30 dark:text-green-400';
                      } else if (isSelectedOption && !isCorrect) {
                        optionClass += 'bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-400';
                      } else {
                        optionClass += 'text-skin-muted';
                      }
                      
                      return `
                        <div class="${optionClass}">
                          <span class="font-medium">${option.id.toUpperCase()}.</span> ${option.text}
                          ${isCorrectOption ? ' ✓' : ''}
                          ${isSelectedOption && !isCorrect ? ' ✗' : ''}
                        </div>
                      `;
                    }).join('') :
                    // Para true_false
                    ['true', 'false'].map(value => {
                      const isCorrectOption = value === q.correct_answer.toString();
                      const isSelectedOption = value === userAnswer?.toString();
                      const label = value === 'true' ? 'Verdadero' : 'Falso';
                      
                      let optionClass = 'p-2 rounded text-sm ';
                      if (isCorrectOption) {
                        optionClass += 'bg-green-50 text-green-800 dark:bg-green-900/30 dark:text-green-400';
                      } else if (isSelectedOption && !isCorrect) {
                        optionClass += 'bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-400';
                      } else {
                        optionClass += 'text-skin-muted';
                      }
                      
                      return `
                        <div class="${optionClass}">
                          <span class="font-medium">${label}</span>
                          ${isCorrectOption ? ' ✓' : ''}
                          ${isSelectedOption && !isCorrect ? ' ✗' : ''}
                        </div>
                      `;
                    }).join('')
                  }
                </div>
              </div>
            </div>
          `;
        });

        html += '</div>';
        content.innerHTML = html;
      }
    }

    // Inicializar la aplicación y hacerla global
    window.quiz = new SucamecQuiz(sucamecData);
    window.quiz.init();
  })();</script>  <!-- Personaje Mascota 8-bit - Contenedor --> <div class="pixel-mascot idle astro-sckkx6r4" id="pixel-mascot"> <div class="pixel-bubble astro-sckkx6r4" id="pixel-bubble"></div> <div id="character-container" class="astro-sckkx6r4"></div> </div> <script src="/pixel-mascot.js" type="module"></script> </body> </html>
